[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psp-pkg-extractor"
version = "0.1.0"
description = "Offline, pure-Python extraction of locally supplied PSP PKG files"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.scripts]
psp-pkg-extractor = "psp_pkg_extractor.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
